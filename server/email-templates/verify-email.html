<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">

          <tr>
            <td align="center" style="background-color:#0f172a;padding:28px 40px;">
              <img src="https://cdn.mcauto-images-production.sendgrid.net/78d231ba0f636805/e1a876f9-37fe-47bb-8ae3-e42ad5d3baa7/802x429.png" width="400" style="display:block;" />
            </td>
          </tr>

          <tr>
            <td style="padding:40px 40px 32px 40px;color:#1a1a1a;">

              <p style="margin:0 0 20px 0;font-size:15px;line-height:1.7;">Hello {{firstName}},</p>

              <p style="margin:0 0 20px 0;font-size:15px;line-height:1.7;">
                Thanks for signing up for <strong>The Digital Ledger</strong>. Please use the verification code below to confirm your email address.
              </p>

              <table width="100%" cellpadding="0" cellspacing="0" style="margin:32px 0;">
                <tr>
                  <td align="center">
                    <div style="display:inline-block;background-color:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:24px 40px;">
                      <p style="margin:0;font-size:36px;font-weight:bold;letter-spacing:10px;color:#0f172a;font-family:'Courier New',monospace;">{{code}}</p>
                    </div>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 20px 0;font-size:14px;line-height:1.7;color:#64748b;text-align:center;">
                This code expires in 10 minutes.
              </p>

              <p style="margin:24px 0 20px 0;font-size:14px;line-height:1.7;color:#64748b;">
                If you didn't create an account, you can safely ignore this email.
              </p>

              <p style="margin:0;font-size:15px;line-height:1.8;">
                <strong>The Digital Ledger team</strong>
              </p>

            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
